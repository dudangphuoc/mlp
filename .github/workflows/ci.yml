# CI (P0-10/P0-11): gate → AOT → image. One build core per job (-m:1); images are built one at a time.
name: ci
on: [push, pull_request]
jobs:
  gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "11.0.x" }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - uses: bufbuild/buf-action@v1
        with: { setup_only: true }
      - run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - run: cd web && npm ci
      - run: gates/run.sh --aot
  images:
    needs: gates
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions: { packages: write, contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: build + push (one at a time)
        run: |
          set -e
          P=ghcr.io/${{ github.repository_owner }}/mlp
          for img in api web node ray-head agent-builder; do
            docker build -f deploy/docker/$img.Dockerfile -t $P/$img:${{ github.sha }} .
            docker push $P/$img:${{ github.sha }}
          done
          docker build -t $P/net:${{ github.sha }} deploy/docker/net
          docker push $P/net:${{ github.sha }}
