syntax = "proto3";
package mlplatform.v1;
option csharp_namespace = "MLPlatform.Contracts.V1";

import "google/protobuf/timestamp.proto";
import "mlplatform/v1/common.proto";

// M01 — IamService (users, sessions)
service IamService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Logout(Empty) returns (Empty);
  rpc GetMe(Empty) returns (Me);
  // S-01-2 profile, S-01-4 API keys
  rpc UpdateProfile(UpdateProfileRequest) returns (Me);
  rpc ChangePassword(ChangePasswordRequest) returns (Empty);
  rpc ListApiKeys(Empty) returns (ListApiKeysResponse);
  rpc CreateApiKey(CreateApiKeyRequest) returns (CreatedApiKey);
  rpc RevokeApiKey(RevokeApiKeyRequest) returns (Empty);
}

// M01 — WorkspaceService
service WorkspaceService {
  rpc ListWorkspaces(Empty) returns (ListWorkspacesResponse);
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (Workspace);
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  rpc CreateInvitation(CreateInvitationRequest) returns (Invitation);
  // S-01-3 members, S-01-5 workspaces
  rpc UpdateWorkspace(UpdateWorkspaceRequest) returns (Empty);
  rpc UpdateMemberRole(UpdateMemberRoleRequest) returns (Empty);
  rpc RemoveMember(RemoveMemberRequest) returns (Empty);
  rpc ListInvitations(ListInvitationsRequest) returns (ListInvitationsResponse);
  rpc RevokeInvitation(RevokeInvitationRequest) returns (Empty);
}

// M01 / D-27 — InstanceService
service InstanceService {
  rpc GetSetupState(Empty) returns (SetupState);
  rpc CompleteSetup(CompleteSetupRequest) returns (Me);
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string username = 3;
  string display_name = 4;
  string invitation_token = 5;   // mlpi_… — sign-up via invitation (allowed even when self sign-up is disabled)
}
message RegisterResponse { string user_id = 1; bool email_verification_required = 2; }

message LoginRequest {
  string email = 1;
  string password = 2;
  string totp_code = 3;
}
message LoginResponse {
  string session_token = 1;   // SDK/CLI; the web app uses a cookie
  Me me = 2;
}

message Me {
  string user_id = 1;
  string email = 2;
  string username = 3;
  string display_name = 4;
  bool is_instance_admin = 5;
  repeated WorkspaceMembership workspaces = 6;
}

message WorkspaceMembership {
  string workspace_id = 1;
  string slug = 2;
  string name = 3;
  string role = 4;
}

message Workspace {
  string id = 1;
  string slug = 2;
  string name = 3;
  string kind = 4;
  google.protobuf.Timestamp created_at = 5;
}
message ListWorkspacesResponse { repeated Workspace workspaces = 1; }
message CreateWorkspaceRequest { string slug = 1; string name = 2; }

message SetupState { bool setup_required = 1; }
message CompleteSetupRequest {
  string bootstrap_token = 1;
  string email = 2;
  string password = 3;
  string username = 4;
  string display_name = 5;
  string instance_name = 6;
  bool allow_signup = 7;
}

message ListMembersRequest { string workspace_id = 1; }
message Member { string user_id = 1; string username = 2; string display_name = 3; string email = 4; string role = 5; }
message ListMembersResponse { repeated Member members = 1; }
message CreateInvitationRequest { string workspace_id = 1; string email = 2; string role = 3; }
message Invitation { string token = 1; google.protobuf.Timestamp expires_at = 2; }

message UpdateProfileRequest { string display_name = 1; }
message ChangePasswordRequest { string current_password = 1; string new_password = 2; }
message ApiKey { string id = 1; string name = 2; google.protobuf.Timestamp created_at = 3; google.protobuf.Timestamp last_used_at = 4;
  string workspace_id = 5; string workspace_name = 6; }   // empty workspace = every workspace of the owner
message ListApiKeysResponse { repeated ApiKey keys = 1; }
message CreateApiKeyRequest { string name = 1; string workspace_id = 2; }   // optional: limit the key to one workspace
message CreatedApiKey { ApiKey key = 1; string token = 2; }   // the mlpk_… token is shown only once
message RevokeApiKeyRequest { string id = 1; }
message UpdateWorkspaceRequest { string workspace_id = 1; string name = 2; }
message UpdateMemberRoleRequest { string workspace_id = 1; string user_id = 2; string role = 3; }
message RemoveMemberRequest { string workspace_id = 1; string user_id = 2; }
message ListInvitationsRequest { string workspace_id = 1; }
message InvitationInfo { string id = 1; string email = 2; string role = 3; google.protobuf.Timestamp created_at = 4; google.protobuf.Timestamp expires_at = 5; google.protobuf.Timestamp accepted_at = 6; }
message ListInvitationsResponse { repeated InvitationInfo invitations = 1; }
message RevokeInvitationRequest { string workspace_id = 1; string id = 2; }
