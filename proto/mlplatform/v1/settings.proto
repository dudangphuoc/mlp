syntax = "proto3";
package mlplatform.v1;
option csharp_namespace = "MLPlatform.Contracts.V1";

import "google/protobuf/timestamp.proto";

// Dynamic instance configuration (Instance Admin): email provider, Telegram, … — stored in the DB, changes need no restart.
// Secret fields are never returned to the client (only has_value); sending empty = keep the current value.
service SettingsService {
  rpc ListSettings(ListSettingsRequest) returns (ListSettingsResponse);
  rpc UpdateSetting(UpdateSettingRequest) returns (Setting);
  rpc TestSetting(TestSettingRequest) returns (TestSettingResponse);
}

message ListSettingsRequest {}
message ListSettingsResponse { repeated Setting settings = 1; }

message SettingField {
  string key = 1;
  string label = 2;
  string type = 3;            // text | number | bool | select | secret
  bool secret = 4;
  bool required = 5;
  string value = 6;           // secret → always empty
  bool has_value = 7;
  string hint = 8;
  repeated string options = 9;
}

message Setting {
  string key = 1;             // email | telegram | …
  string title = 2;
  string description = 3;
  bool enabled = 4;
  repeated SettingField fields = 5;
  google.protobuf.Timestamp updated_at = 6;
  string test_hint = 7;       // hint for the "send test to" field
}

message UpdateSettingRequest {
  string key = 1;
  bool enabled = 2;
  map<string, string> values = 3;   // empty secret = unchanged; "-" = clear
}

message TestSettingRequest {
  string key = 1;
  string to = 2;              // recipient email / chat id (empty = configured default)
}
message TestSettingResponse { bool ok = 1; string message = 2; }
