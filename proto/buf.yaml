# Proto is the single contract (P0-6). CI gate: `buf lint` + `buf breaking --against` the main branch.
# Uses the STANDARD set except the RPC/enum naming rules that API v1 fixed from the start (changing them would break clients) — documented in 50-lo-trinh/02 §3b.
version: v2
modules:
  - path: .
lint:
  use: [STANDARD]
  except:
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
  ignore_only:
    SERVICE_SUFFIX: [mlplatform/v1/model_server.proto]   # contract with the Python model server; keep the name
breaking:
  use: [FILE]
