server {
  listen 8080;
  root /usr/share/nginx/html;
  client_max_body_size 0;
  # api gRPC-Web + HTTP (upload, /v1 gateway, /install, /notebooks WebSocket proxy)
  location ~ ^/(mlplatform\.v1\.|install/|feedback|serve/|nb/|health/|v1/|mcp$) {
    proxy_pass http://127.0.0.1:5081;   # web + api share the wireguard network namespace (D-26) → reachable over the overlay
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
  # Bundles have a hash in their name → long cache; index.html is always revalidated (no stale JS after an update).
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location / { add_header Cache-Control "no-cache" always; try_files $uri /index.html; }
}
# Subdomains nb-{id}.{domain} (notebook) and {slug}--{ws}.{domain} (deployment): every path goes to the api (the api rewrites the path by Host).
server {
  listen 8080;
  server_name "~^nb-[0-9a-f]{32}\." "~^[a-z0-9][a-z0-9-]*--[a-z0-9-]+\.";
  client_max_body_size 0;
  location / {
    proxy_pass http://127.0.0.1:5081;   # web + api share the wireguard network namespace (D-26) → reachable over the overlay
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
}
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
