apiVersion: mlplatform/v1
kind: Recipe
metadata:
  name: vibevoice-realtime
  displayName: VibeVoice-Realtime 0.5B (Microsoft, inference only)
  family: speech-generation
  description: >
    Low-latency streaming TTS, single speaker, English. No training code; used for serving.
    Voices are bundled .pt files (en-Carter/Davis/Emma/Frank/Grace/Mike, in-Samuel, and experimental voices);
    custom voices require contacting Microsoft.
  homepage: https://github.com/microsoft/VibeVoice
  maturity: experimental      # streaming handler not written yet
  verification:
    sourcesCheckedAt: "2026-11-17"
    built: false
    smokeTested: false
source:
  git: https://github.com/microsoft/VibeVoice
  ref: main
  commit: 16fb2cb1217c9934a886e1948ffb06120caa2df5
  commitDate: "2026-10-08"
license:
  code: MIT
  weights: MIT
  requiresAck: true
  notes: >
    Model card: English only; out of scope includes voice impersonation without consent, disinformation,
    real-time deep-fakes, bypassing the watermark; recommended for research only. Audio carries the notice
    "This segment was generated by AI" and an inaudible watermark.
tasks: [tts]
environment:
  base: nvcr.io/nvidia/pytorch:24.12-py3
  apt: [ffmpeg]
  pip: ["-e '/opt/recipe/src[streamingtts]'"]
  copy: [{from: vibevoice-realtime/handler.py, to: /opt/recipe/}]
  workdir: /opt/recipe
  gpu: optional          # README: T4 / Mac M4 Pro reach real time
  minVramGb: 4           # estimate for a ~1B-parameter model; no official figure yet
  python: "3.12"
data:
  input: none
variants:
  - {name: vibevoice-realtime-0.5b, weights: hf://microsoft/VibeVoice-Realtime-0.5B, params: 1018}
entrypoints:
  predict:
    inputs:
      script: {type: file, required: true, description: "Text .txt file to read aloud"}
      speaker: {type: string, required: true, description: "Name of a bundled voice in the demo's voices directory (e.g. en-Carter)"}
    workdir: /opt/recipe/src
    command: >
      python demo/realtime_model_inference_from_file.py --model_path {model.weights}
      --txt_path {input.script} --speaker_name {input.speaker} --output_dir {output} --cfg_scale 1.5
  # serve: not declared — the streaming handler is still a skeleton (M17 R2)
artifacts:
  best: {as: hf}                  # temporary model directory from the variant: weights/hf/ (20/08 §8)
metrics:
  sources: []
  primary: none
openItems:
  - "Inference-only recipe: the M17 smoke test skips the training step."
  - "handler.py (streaming) needs to follow demo/vibevoice_realtime_demo.py (WebSocket) — API not verified."
  - "Installed with `pip install -e .[streamingtts]` (pins transformers==4.51.3); docs tested with NVIDIA PyTorch 24.07/24.10/24.12 containers."
