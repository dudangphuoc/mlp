apiVersion: mlplatform/v1
kind: Recipe
metadata:
  name: vibevoice-tts
  displayName: VibeVoice TTS 1.5B / 7B (community fork, fine-tune)
  family: speech-generation
  description: >
    Long-form, multi-speaker conversational TTS. Microsoft removed the TTS code from the official repo on 2025-09-05
    due to misuse; the recipe uses the vibevoice-community/VibeVoice fork (MIT), which has inference code and
    experimental LoRA fine-tuning.
  homepage: https://github.com/vibevoice-community/VibeVoice
  maturity: experimental      # fine-tuning is "highly experimental", serve handler not written yet
  verification:
    sourcesCheckedAt: "2026-11-17"
    built: false
    smokeTested: false
source:
  git: https://github.com/vibevoice-community/VibeVoice
  ref: main
  commit: 952326ddb264062466a888cf32a5b2f4e803e16e
  commitDate: "2026-08-29"
license:
  code: MIT
  weights: MIT
  requiresAck: true
  notes: >
    The (Microsoft) model card lists as out of scope: impersonating someone's voice without recorded consent,
    disinformation, real-time voice conversion/deep-fakes, bypassing the watermark; it advises against commercial/real-world
    use without further testing, research only. The fork describes fine-tuning as "highly experimental".
    Microsoft removed the TTS code because of misuse.
tasks: [tts]
environment:
  base: pytorch/pytorch:2.6.0-cuda12.4-cudnn9-devel
  apt: [ffmpeg]
  pip: ["-e /opt/recipe/src", tensorboard]   # flash-attn is optional (SDPA fallback); compiling it took hours and failures were hidden
  copy: [{from: vibevoice-tts/handler.py, to: /opt/recipe/}, {from: _shared/converters/, to: /opt/recipe/shared/converters/}]
  workdir: /opt/recipe
  gpu: required
  minVramGb: 16          # voicepowered-ai README: ≥16 GB for 1.5B LoRA, ≥48 GB for 7B LoRA
  python: "3.11"
data:
  input: vibevoice-tts-jsonl     # the recipe's converter, reads tts-manifest output
  # audio is resampled to 24 kHz automatically; missing voice_prompts → a random 5–15 s clip from the target audio; fine-tuning supports 1 speaker only
converters:
  - key: vibevoice-tts-jsonl
    tasks: [tts]
    from: tts-manifest
    script: python /opt/recipe/shared/converters/vibevoice_tts_jsonl.py --src {converter.src} --dst {converter.dst}
    output: "{split}.jsonl: {\"text\": \"Speaker 0: …\", \"audio\": \"/abs.wav\", \"voice_prompts\"?: \"/abs.wav\"}"
variants:
  - {name: vibevoice-1.5b, displayName: VibeVoice 1.5B, weights: hf://vibevoice/VibeVoice-1.5B, params: 2700, minVramGb: 16}
  - {name: vibevoice-7b,   displayName: VibeVoice 7B (Large), weights: hf://vibevoice/VibeVoice-7B, params: 9340, minVramGb: 48}
params:
  num_train_epochs: {type: number, default: 1}
  per_device_train_batch_size: {type: integer, default: 8}
  gradient_accumulation_steps: {type: integer, default: 16}
  learning_rate: {type: number, default: 2.5e-5}
  lora_r: {type: integer, default: 8}
  lora_alpha: {type: integer, default: 32}
  lora_dropout: {type: number, default: 0.05}
  train_diffusion_head: {type: boolean, default: true}
  ddpm_batch_mul: {type: integer, default: 4}
  diffusion_loss_weight: {type: number, default: 1.4}
  ce_loss_weight: {type: number, default: 0.04}
  voice_prompt_drop_rate: {type: number, default: 0.2, description: "1.0 gives a more natural single voice but loses voice cloning"}
  eval_steps: {type: integer, default: 100}
entrypoints:
  train:
    distributed: none            # the fork does not document torchrun/accelerate for this script
    workdir: /opt/recipe/src
    command: >
      python -m vibevoice.finetune.train_vibevoice
      --model_name_or_path {weights}
      --train_jsonl {data.train} --validation_jsonl {data.val}
      --text_column_name text --audio_column_name audio --voice_prompts_column_name voice_prompts
      --output_dir {output}
      --per_device_train_batch_size {params.per_device_train_batch_size}
      --gradient_accumulation_steps {params.gradient_accumulation_steps}
      --learning_rate {params.learning_rate} --num_train_epochs {params.num_train_epochs}
      --logging_steps 10 --save_steps {params.eval_steps} --eval_steps {params.eval_steps}
      --report_to tensorboard --logging_dir {output}/runs
      --remove_unused_columns False --bf16 True --do_train --gradient_clipping
      --gradient_checkpointing False
      --ddpm_batch_mul {params.ddpm_batch_mul} --diffusion_loss_weight {params.diffusion_loss_weight}
      --train_diffusion_head {params.train_diffusion_head} --ce_loss_weight {params.ce_loss_weight}
      --voice_prompt_drop_rate {params.voice_prompt_drop_rate}
      --lora_r {params.lora_r} --lora_alpha {params.lora_alpha} --lora_dropout {params.lora_dropout}
      --lora_target_modules q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj
      --lr_scheduler_type cosine --warmup_ratio 0.03 --max_grad_norm 0.8
    resume: {mode: append, args: "--resume_from_checkpoint {checkpoint}"}
    checkpoints: "{output}/checkpoint-*"
  predict:
    workdir: /opt/recipe/src
    inputs:
      script: {type: file, required: true, description: "Script .txt file, one 'Speaker N: …' per line"}
      speakers: {type: string, required: true, description: "Voice names in speaker order, comma-separated"}
    command: >
      python demo/inference_from_file.py --model_path {base_weights} --checkpoint_path {model.weights}
      --txt_path {input.script} --speaker_names {input.speakers} --output_dir {output} --cfg_scale 1.3
  # serve: not declared — handler.py is still a skeleton (M17 R2)
metrics:
  sources:
    - tensorboard: "{output}/runs"
  primary: val/loss
  map:
    train/ce_loss: train/ce_loss
    train/diffusion_loss: train/diffusion_loss
    eval/ce_loss: val/ce_loss
    eval/diffusion_loss: val/diffusion_loss
    eval/loss: val/loss
    train/loss: train/loss
artifacts:
  best: {from: ["lora"], as: lora}   # adapter LLM + diffusion_head/ + acoustic_connector/ + semantic_connector/ → weights/lora/
  baseWeights: "{weights.ref}"
  files:
    - {from: trainer_state.json, to: config/trainer_state.json}
openItems:
  - "Speaker labels in text: FINETUNING.md uses \"Speaker 1:\", the voicepowered README uses \"Speaker 0:\" — try during smoke test; the converter writes \"Speaker 0:\" by default."
  - "The fork pins transformers==4.51.3, accelerate==1.6.0, datasets==3.5.0; not checked against the current torch/CUDA/flash-attn."
  - "Multi-GPU for train_vibevoice.py is undocumented → the recipe uses distributed: none (1 machine, 1 GPU)."
  - "No automatic voice-quality metric; evaluate by listening to samples (M09 Artifacts tab)."
  - "handler.py needs to call internal APIs of demo/inference_from_file.py — class/function names not verified."
